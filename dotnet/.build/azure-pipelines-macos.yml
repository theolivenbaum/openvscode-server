# Azure DevOps pipeline that builds the openvscode-server darwin-arm64
# (Apple Silicon) distribution, packs it into the .NET library, and publishes
# the resulting NuGet package as a build artifact.
#
# Trigger this pipeline from Azure DevOps and select it as the YAML source:
#   dotnet/.build/azure-pipelines-macos.yml
#
# What it does, in order:
#   1. Checks out the repository.
#   2. Installs the Node.js version pinned in .nvmrc.
#   3. Installs the .NET SDK that the library targets (net10.0).
#   4. Runs scripts/build-vscode-release.sh darwin arm64 to produce
#      vscode-reh-web-darwin-arm64.tar.gz under
#      dotnet/OpenVSCodeServer.Kestrel/EmbeddedAssets/.
#   5. Runs `dotnet pack` so the .nupkg embeds the freshly-built archive.
#   6. Publishes both the .tar.gz and the .nupkg as pipeline artifacts.

name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none           # manual / scheduled / API-driven; no automatic trigger
pr: none

parameters:
  - name: buildConfiguration
    type: string
    default: Release
    values:
      - Debug
      - Release

variables:
  # macos-latest currently maps to an Apple Silicon (arm64) image on
  # Microsoft-hosted agents, which is exactly what we want for darwin-arm64.
  - name: vmImage
    value: macos-latest
  - name: vscodePlatform
    value: darwin
  - name: vscodeArch
    value: arm64
  - name: dotnetSdkVersion
    value: '10.0.x'
  - name: ELECTRON_SKIP_BINARY_DOWNLOAD
    value: '1'
  - name: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
    value: '1'
  - name: npm_config_arch
    value: arm64
  - name: VSCODE_ARCH
    value: arm64
  # Mirrors the upstream macOS PR workflow: prevents kerberos from using dlopen,
  # which can otherwise fail to resolve at runtime on hosted macOS agents.
  - name: GYP_DEFINES
    value: kerberos_use_rtld=false

stages:
  - stage: Build
    displayName: Build macOS arm64
    jobs:
      - job: Build
        displayName: vscode-reh-web-darwin-arm64
        pool:
          vmImage: $(vmImage)
        timeoutInMinutes: 120
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: Checkout sources

          - task: NodeTool@0
            displayName: Use Node.js from .nvmrc
            inputs:
              versionSource: 'fromFile'
              versionFilePath: '.nvmrc'

          - task: UseDotNet@2
            displayName: Use .NET SDK $(dotnetSdkVersion)
            inputs:
              packageType: sdk
              version: $(dotnetSdkVersion)

          - bash: |
              set -e
              node --version
              npm  --version
              dotnet --info
              clang --version || true
              xcode-select -print-path || true
              # Upstream installs setuptools so node-gyp finds distutils on
              # the current Python; harmless if already present.
              python3 -m pip install --break-system-packages setuptools || true
            displayName: Show tool versions / prep toolchain

          - bash: |
              set -e
              chmod +x scripts/build-vscode-release.sh
              ./scripts/build-vscode-release.sh "$(vscodePlatform)" "$(vscodeArch)"
            displayName: Build openvscode-server (darwin-arm64)
            env:
              ELECTRON_SKIP_BINARY_DOWNLOAD: $(ELECTRON_SKIP_BINARY_DOWNLOAD)
              PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: $(PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD)
              npm_config_arch: $(npm_config_arch)
              VSCODE_ARCH: $(VSCODE_ARCH)
              GYP_DEFINES: $(GYP_DEFINES)

          - bash: |
              set -e
              ls -la dotnet/OpenVSCodeServer.Kestrel/EmbeddedAssets/*.tar.gz
              du -h  dotnet/OpenVSCodeServer.Kestrel/EmbeddedAssets/*.tar.gz
            displayName: Show staged archive(s)

          - task: DotNetCoreCLI@2
            displayName: dotnet restore
            inputs:
              command: restore
              projects: dotnet/OpenVSCodeServer.slnx

          - task: DotNetCoreCLI@2
            displayName: dotnet build (${{ parameters.buildConfiguration }})
            inputs:
              command: build
              projects: dotnet/OpenVSCodeServer.slnx
              arguments: --configuration ${{ parameters.buildConfiguration }} --no-restore

          - task: DotNetCoreCLI@2
            displayName: dotnet pack (${{ parameters.buildConfiguration }})
            inputs:
              command: pack
              packagesToPack: dotnet/OpenVSCodeServer.Kestrel/OpenVSCodeServer.Kestrel.csproj
              configuration: ${{ parameters.buildConfiguration }}
              nobuild: true
              includesymbols: true
              versioningScheme: off
              outputDir: $(Build.ArtifactStagingDirectory)/nupkg

          - task: PublishPipelineArtifact@1
            displayName: Publish reh-web archive
            inputs:
              targetPath: dotnet/OpenVSCodeServer.Kestrel/EmbeddedAssets
              artifact: vscode-reh-web-darwin-arm64
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: Publish NuGet package
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/nupkg
              artifact: OpenVSCodeServer.Kestrel-darwin-arm64-nupkg
              publishLocation: pipeline
