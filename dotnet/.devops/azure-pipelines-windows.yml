# Azure DevOps pipeline that builds the openvscode-server win32-x64 (win64)
# distribution and publishes the resulting tar.gz archive as a build
# artifact for later embedding into the .NET library.
#
# Trigger this pipeline from Azure DevOps and select it as the YAML source:
#   dotnet/.build/azure-pipelines-windows.yml
#
# What it does, in order:
#   1. Checks out the repository.
#   2. Installs the Node.js version pinned in .nvmrc.
#   3. Runs scripts/build-vscode-release.ps1 to produce
#      vscode-reh-web-win32-x64.tar.gz under
#      dotnet/OpenVSCodeServer.Kestrel/EmbeddedAssets/.
#   4. Publishes the .tar.gz as a pipeline artifact.

name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none           # manual / scheduled / API-driven; no automatic trigger
pr: none

variables:
  - name: vmImage
    value: windows-latest
  - name: nodeArch
    value: x64
  - name: vscodePlatform
    value: win32
  - name: vscodeArch
    value: x64
  # Skip downloads we never need for a reh-web build.
  - name: ELECTRON_SKIP_BINARY_DOWNLOAD
    value: '1'
  - name: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
    value: '1'
  - name: npm_config_arch
    value: x64
  - name: VSCODE_ARCH
    value: x64
  # Trim built-in extensions to what a pure C# / BYO-LSP environment needs.
  - name: VSCODE_MINIMAL_BUILD
    value: '1'

stages:
  - stage: Build
    displayName: Build Windows x64
    jobs:
      - job: Build
        displayName: vscode-reh-web-win32-x64
        pool:
          vmImage: $(vmImage)
        timeoutInMinutes: 120
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: Checkout sources

          - task: NodeTool@0
            displayName: Use Node.js from .nvmrc
            inputs:
              versionSource: 'fromFile'
              versionFilePath: '.nvmrc'

          - powershell: |
              node --version
              npm  --version
            displayName: Show tool versions

          # The gulp build writes its output one level above the repo root
          # (BUILD_ROOT = path.dirname(REPO_ROOT)). On Azure-hosted Windows
          # agents the default working directory is well within Build.SourcesDirectory,
          # which has a sibling we can use for that purpose.
          - powershell: |
              $ErrorActionPreference = 'Stop'
              pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-vscode-release.ps1 -Platform $(vscodePlatform) -Arch $(vscodeArch)
            displayName: Build openvscode-server (win32-x64)
            env:
              ELECTRON_SKIP_BINARY_DOWNLOAD: $(ELECTRON_SKIP_BINARY_DOWNLOAD)
              PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: $(PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD)
              npm_config_arch: $(npm_config_arch)
              VSCODE_ARCH: $(VSCODE_ARCH)
              VSCODE_MINIMAL_BUILD: $(VSCODE_MINIMAL_BUILD)

          - powershell: |
              $ErrorActionPreference = 'Stop'
              Get-ChildItem dotnet\OpenVSCodeServer.Kestrel\EmbeddedAssets\*.tar.gz |
                  Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,1)}}
            displayName: Show staged archive(s)

          - task: PublishPipelineArtifact@1
            displayName: Publish reh-web archive
            inputs:
              targetPath: dotnet/OpenVSCodeServer.Kestrel/EmbeddedAssets
              artifact: vscode-reh-web-win32-x64
              publishLocation: pipeline
